<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Employees</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        .form-inline { display: flex; gap: 10px; align-items: center; }
        input[type="text"], input[type="submit"], button { padding: 8px; font-size: 14px; }
        button, .delete-btn { background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .nav-link { display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="nav-link">&larr; Back to Scheduler</a>
        <h1>Manage Employees</h1>

        <h2>Add New Employee</h2>
        <form method="post" class="form-inline">
            <input type="hidden" name="action" value="add">
            <input type="text" name="name" placeholder="Employee Name" required>
            <input type="submit" value="Add Employee">
        </form>

        <h2>Employee List</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Remaining Annual Leave (12 days total)</th>
                    <th>Other Absences (Sick/Permission)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for employee in employees %}
                <tr>
                    <td>{{ employee.name }}</td>
                    <td>{{ employee.remaining_leave }}</td>
                    <td>{{ employee.other_absences }}</td>
                    <td>
                        <form method="post" style="display:inline;">
                            <input type="hidden" name="action" value="delete">
                            <input type="hidden" name="id" value="{{ employee.id }}">
                            <button type="submit" class="delete-btn">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
